; Device profile overrides for the project. Engine defaults are in Engine/Config/BaseDeviceProfiles.ini.

[Meta_Quest_3 DeviceProfile]
; Epic's Quest profiles turn the chunked Vulkan PSO cache off. Without it (and without a recorded
; PSO cache shipped with the build), PSOs precompiled at startup are created with no pipeline cache:
; they never hit the PSO cache saved on the device and are never added to it, so the precompile
; (PSOPrecompilePool threads) repeats in full on every launch. Turn the chunked cache back on.
-CVars=r.Vulkan.UseChunkedPSOCache=0
+CVars=r.Vulkan.UseChunkedPSOCache=1
