; Android (Meta Quest) overrides of DefaultGame.ini. Desktop builds don't read this file.

[/Script/EngineSettings.GeneralProjectSettings]
; The app is a VR app on Quest: start in stereo.
bStartInVR=True

[/Script/SuperDexPhysics.MochiPhysicsSettings]
; By default Mochi starts 4 worker threads on Quest's 6 cores. Its async scene steps back to back on
; them and starves Unreal's game, render and RHI threads: 36-60 FPS instead of 72. Two workers hold
; 72 FPS in Shipping builds. Don't go down to one: robot-hand IK runs a synchronous Mochi solve on
; the game thread that needs a free worker, and with one the async scene keeps it busy (switching
; to a robot hand drops to ~3 FPS).
NumWorkerThreads=2
