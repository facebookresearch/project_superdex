; Android (Meta Quest) overrides of DefaultEngine.ini. Desktop builds don't read this file.
; Settings that change the mobile shader map key (vr.MobileMultiView, r.MobileHDR,
; r.Mobile.UseHWsRGBEncoding) belong in DefaultEngine.ini instead: the cook runs in the Windows
; editor and would key the shaders differently from the device.

[/Script/Engine.RendererSettings]
; No MSAA. With 4x MSAA (the engine default) a UE 5.8 Quest build shows its first frame and then only
; black, with the frame loop still running. Revisit before turning MSAA back on.
r.Mobile.AntiAliasing=3
r.MSAACount=1
