// Wire contract for SuperDex teleop over Zenoh. We keep this purposefully simple
// for maximum flexibility between embodiments.
// Messages only provide basic data where the Zenoh keys (topics) describe the usage.
// e.g. "teleop/robot_name/arm_joint_targets"

// We do assume meters, FLU convention (x-forward, y-left-, z-up) and joint values in radians

// teleop_codec.h provides a C++ wrapper for nanopb, but these message can be used with
// any protobuf implementation.

syntax = "proto3";

package superdex.teleop.v1;

message Header {
  int64 stamp_ns = 1; // UTC, nanoseconds since the Unix epoch
  uint32 seq = 2; // per-publisher, wraps
}

message Pose {
  double px = 1;
  double py = 2;
  double pz = 3;
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

// Joint positions, velocities, efforts, sensors, etc.
message DoubleArray {
  Header header = 1;
  repeated double data = 2;
}

// 6-dof end-effector pose targets and states
message PoseArray {
  Header header = 1;
  repeated Pose poses = 2;
}
