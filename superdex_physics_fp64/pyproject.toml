[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "superdex-physics-fp64"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Double-precision physics extension for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "thirdparty_licenses/**/*"]
dependencies = ["superdex-physics==1.0.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.scikit-build]
build-dir = "../build-fp64/{wheel_tag}"
wheel.packages = ["superdex_physics_fp64"]
wheel.install-dir = "superdex_physics_fp64/_native"
build.targets = ["mochi_physics_pybind"]
install.components = ["mochi_physics_pybind"]

[tool.scikit-build.cmake]
source-dir = ".."
args = [
    "-GNinja",
    "-DMOCHI_BUILD_DEBUGGER=OFF",
    "-DMOCHI_BUILD_MESH_CLI=OFF",
    "-DMOCHI_BUILD_RENDERER=OFF",
    "-DMOCHI_BUILD_SHARED=ON",
    "-DMOCHI_USE_DOUBLE_PRECISION=ON",
    "-DMOCHI_USE_PYBIND=ON",
    "-DSUPERDEX_BUILD_ROBOTICS=OFF",
]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*musllinux* *-win32"
test-skip = "*"

[tool.cibuildwheel.linux]
environment-pass = ["http_proxy", "https_proxy", "no_proxy"]
before-all = "yum install -y clang"

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel} --ignore-existing"
