[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "superdex-mesh-cli"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "GPL-licensed out-of-process mesh geometry helper for SuperDex"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "thirdparty_licenses/**/*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.uv]
managed = false

[tool.scikit-build]
build-dir = "../build-fp32/{wheel_tag}"
wheel.packages = ["superdex_mesh_cli"]
wheel.install-dir = "superdex_mesh_cli/_native"
build.targets = ["superdex_mesh_cli"]
install.components = ["superdex_mesh_cli"]

[tool.scikit-build.cmake]
source-dir = ".."
args = [
    "-GNinja",
    "-DMOCHI_BUILD_MESH_CLI=ON",
    "-DMOCHI_BUILD_SHARED=ON",
    "-DMOCHI_BUILD_DEBUGGER=OFF",
    "-DMOCHI_BUILD_RENDERER=OFF",
    "-DMOCHI_USE_PYBIND=OFF",
    "-DSUPERDEX_BUILD_ROBOTICS=OFF",
    "-DSUPERDEX_BUILD_STUDIO=OFF",
]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*musllinux* *-win32"
test-skip = "*"

[tool.cibuildwheel.linux]
environment-pass = ["http_proxy", "https_proxy", "no_proxy"]
before-all = "yum install -y clang"

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel} --ignore-existing"
