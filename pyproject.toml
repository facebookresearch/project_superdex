[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdex-dev"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "Local editable development workspace for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
# Blocks upload: this resolves through local paths, so a published copy would be a shell.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
build = [
    "cmake>=3.25",
    "ninja>=1.5",
    "scikit-build-core>=0.11",
]

core = [
    "superdex-dev[build]",
    "superdex-lab",
    "superdex-physics",
    "superdex-robotics",
]

double = [
    "superdex-dev[core]",
    "superdex-physics-fp64",
    "superdex-robotics-fp64",
]

gui = [
    "superdex-dev[core]",
    "superdex-mesh-cli",
    "superdex-physics-debugger",
    "superdex-studio",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.setuptools]
py-modules = []

[tool.uv]
# Wheel users install the published distributions into `.venv` and run the examples
# from this checkout. Do not replace that environment with the local development
# project or install source-build tooling unless it is explicitly requested.
package = false

# The native distributions share one CMake build tree (see `build-dir` in each of their
# pyproject.toml files) and ninja takes no lock on a build directory. uv builds distributions
# concurrently by default -- including ones that depend on each other, because a runtime
# dependency orders installs, not builds -- so without this two of them configure into the
# same tree at once and it fails, typically on a half-written `.skbuild-info.json`.
#
# This costs no wall time. Each build still uses every core, and going one at a time is what
# lets a later distribution reuse the objects an earlier one just built.
concurrent-builds = 1
no-build-isolation-package = [
    "superdex-mesh-cli",
    "superdex-physics",
    "superdex-physics-debugger",
    "superdex-physics-fp64",
    "superdex-robotics",
    "superdex-robotics-fp64",
    "superdex-studio",
]

[tool.uv.sources]
# Source builds are explicit root-project extras. The component projects are unmanaged
# so `uv run` never turns a script invocation into an implicit source build.
superdex-lab = {path = "superdex_lab", editable = true}
superdex-mesh-cli = {path = "superdex_mesh_cli", editable = true}
superdex-physics = {path = "superdex_physics/wheels/superdex-physics", editable = true}
superdex-physics-debugger = {path = "superdex_physics_debugger", editable = true}
superdex-physics-fp64 = {path = "superdex_physics/wheels/superdex-physics-fp64", editable = true}
superdex-robotics = {path = "superdex_robotics/wheels/superdex-robotics", editable = true}
superdex-robotics-fp64 = {path = "superdex_robotics/wheels/superdex-robotics-fp64", editable = true}
superdex-studio = {path = "superdex_studio", editable = true}
