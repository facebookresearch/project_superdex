[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdex-dev"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "Local editable development workspace for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
# Blocks upload: this resolves through local paths, so a published copy would be a shell.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
core = [
    "superdex-lab",
    "superdex-physics",
    "superdex-robotics",
]

double = [
    "superdex-dev[core]",
    "superdex-physics-fp64",
    "superdex-robotics-fp64",
]

gui = [
    "superdex-dev[core]",
    "superdex-mesh-cli",
    "superdex-physics-debugger",
    "superdex-studio",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "cmake>=3.25",
    "ninja>=1.5",
    "scikit-build-core>=0.11",
]

[tool.uv]
# The native distributions share one CMake build tree (see `build-dir` in each of their
# pyproject.toml files) and ninja takes no lock on a build directory. uv builds distributions
# concurrently by default -- including ones that depend on each other, because a runtime
# dependency orders installs, not builds -- so without this two of them configure into the
# same tree at once and it fails, typically on a half-written `.skbuild-info.json`.
#
# This costs no wall time. Each build still uses every core, and going one at a time is what
# lets a later distribution reuse the objects an earlier one just built.
concurrent-builds = 1
no-build-isolation-package = [
    "superdex-mesh-cli",
    "superdex-physics",
    "superdex-physics-debugger",
    "superdex-physics-fp64",
    "superdex-robotics",
    "superdex-robotics-fp64",
    "superdex-studio",
]

[tool.uv.workspace]
# Every distribution in the repo. Without this, uv resolves whatever pyproject.toml is
# nearest the command -- so running a script inside a distribution roots the resolution
# there, which then has to satisfy that distribution's own extras from its own sources
# and fails. Declaring the workspace makes any entry point resolve against one lockfile
# and one environment, and lets the members below stay in a single place.
members = [
    "superdex_lab",
    "superdex_mesh_cli",
    "superdex_meta",
    "superdex_physics_debugger",
    "superdex_physics_fp64",
    "superdex_python",
    "superdex_robotics",
    "superdex_robotics_fp64",
    "superdex_studio",
]

[tool.uv.sources]
superdex-lab = {workspace = true}
superdex-mesh-cli = {workspace = true}
superdex-physics = {workspace = true}
superdex-physics-debugger = {workspace = true}
superdex-physics-fp64 = {workspace = true}
superdex-robotics = {workspace = true}
superdex-robotics-fp64 = {workspace = true}
superdex-studio = {workspace = true}
