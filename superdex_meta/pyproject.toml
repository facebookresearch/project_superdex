[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdex"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Umbrella package for the public SuperDex Python distributions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "superdex-lab==1.0.0",
    "superdex-physics==1.0.0",
    "superdex-physics-debugger==1.0.0",
    "superdex-physics-fp64==1.0.0",
    "superdex-robotics==1.0.0",
    "superdex-robotics-fp64==1.0.0",
    "superdex-studio==1.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.setuptools]
py-modules = []

[tool.uv.sources]
superdex-lab = {workspace = true}
superdex-mesh-cli = {workspace = true}
superdex-physics = {workspace = true}
superdex-physics-debugger = {workspace = true}
superdex-physics-fp64 = {workspace = true}
superdex-robotics = {workspace = true}
superdex-robotics-fp64 = {workspace = true}
superdex-studio = {workspace = true}
