[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdex-lab"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Gymnasium-based environment and benchmarking surfaces for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "superdex-physics==1.0.0",
    "superdex-robotics==1.0.0",
    "gymnasium>=1.1.1",
    "h5py>=3.11.0",
    "numpy>=1.26.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.setuptools.packages.find]
where = ["."]
include = ["superdex", "superdex.*"]
namespaces = true

[tool.setuptools.package-data]
"superdex.lab" = ["py.typed"]

[tool.uv]
managed = false
