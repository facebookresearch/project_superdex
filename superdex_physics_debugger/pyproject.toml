[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "superdex-physics-debugger"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Standalone debugger UI for SuperDex physics scenes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "thirdparty_licenses/**/*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.gui-scripts]
superdex-physics-debugger = "superdex_physics_debugger.__main__:main"

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.uv]
managed = false

[tool.scikit-build]
build-dir = "../build-fp32/{wheel_tag}"
wheel.packages = ["superdex_physics_debugger"]
wheel.install-dir = "superdex_physics_debugger/_native"
build.targets = ["mochi_debugger"]
install.components = ["mochi_debugger"]

[tool.scikit-build.env]
CC = { env = "CC" }
CXX = { env = "CXX" }

[tool.scikit-build.cmake]
source-dir = ".."
args = [
    "-GNinja",
    "-DMOCHI_BUILD_DEBUGGER=ON",
    "-DMOCHI_BUILD_RENDERER=ON",
    "-DMOCHI_BUILD_SHARED=ON",
    "-DMOCHI_BUILD_MESH_CLI=OFF",
    "-DMOCHI_USE_PYBIND=OFF",
    "-DSUPERDEX_BUILD_ROBOTICS=OFF",
]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*musllinux* *-win32"
test-skip = "*"

[tool.cibuildwheel.linux]
environment-pass = ["http_proxy", "https_proxy", "no_proxy"]
before-all = """yum install -y clang libX11-devel libXext-devel libXrandr-devel \
libXinerama-devel libXcursor-devel libXi-devel libxcb-devel mesa-libGL-devel"""
repair-wheel-command = """auditwheel repair -w {dest_dir} {wheel} \
--exclude libGL.so.1 --exclude libGLX.so.0 --exclude libGLdispatch.so.0 \
--exclude libX11.so.6 --exclude libX11-xcb.so.1 --exclude libxcb.so.1 \
--exclude libXext.so.6 --exclude libXrandr.so.2 --exclude libXinerama.so.1 \
--exclude libXcursor.so.1 --exclude libXi.so.6 --exclude libXrender.so.1 \
--exclude libXfixes.so.3 --exclude libXau.so.6 --exclude libXdmcp.so.6"""

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel} --ignore-existing"
