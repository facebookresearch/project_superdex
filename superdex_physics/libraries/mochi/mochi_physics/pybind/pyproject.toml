# Build system configuration.
[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

# Project metadata.
[project]
name = "mochi_bindings"
version = "0.0.1"
authors = [{ name = "Mochi Team" }]
requires-python = ">=3.12"
dependencies = []

# Build configuration.
[tool.scikit-build]
build.targets = ["mochi_physics_pybind"]
cmake.args = ["-DMOCHI_BUILD_SHARED=OFF", "-DMOCHI_USE_PYBIND=ON"]
cmake.build-type = "Release"
cmake.source-dir = "../../"
cmake.version = ">=3.25"
install.components = ["mochi_physics_pybind"]
wheel.cmake = true
wheel.packages = ["mochi_physics_pybind"]
